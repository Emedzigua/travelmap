<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="utf-8">
    <title>My Personal Travel Diary</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #000; font-family: 'Segoe UI', Roboto, sans-serif; color: white; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; opacity: 0; transition: opacity 0.5s ease; cursor: crosshair; }
        #map.visible { opacity: 1; }
        
        /* Ochranná obrazovka */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0a;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000;
        }
        .auth-box {
            background: rgba(25, 25, 25, 0.9); padding: 30px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1); text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .auth-box h2 { margin-top: 0; color: #00ffcc; letter-spacing: 1px; }
        .auth-box input {
            background: #111; border: 1px solid #333; color: white; padding: 12px 20px;
            border-radius: 10px; font-size: 16px; margin: 15px 0; width: 200px; text-align: center; outline: none;
        }
        .auth-box button {
            background: #00ffcc; border: none; color: black; padding: 12px 25px;
            border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .auth-box button:hover { background: #00d2d3; transform: scale(1.05); }
        #auth-error { color: #ff4d4d; font-size: 13px; margin-top: 10px; display: none; }

        /* UI Panely */
        .ui-panel {
            position: absolute; background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 15px; z-index: 1000; box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            pointer-events: auto;
        }
        #stats-panel { top: 15px; left: 15px; width: 230px; }
        #style-panel { top: 15px; right: 60px; padding: 8px; display: flex; gap: 5px; }

        .count-val { color: #00ffcc; font-size: 24px; font-weight: 800; display: block; }
        .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 4px; }

        #year-filter { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
        .year-btn { 
            background: #252525; border: none; color: #ccc; padding: 5px 12px; 
            border-radius: 8px; cursor: pointer; font-size: 12px; transition: 0.3s;
        }
        .year-btn.active { background: #00ffcc; color: #000; font-weight: bold; }
        .style-btn { background: #252525; border: 1px solid rgba(255,255,255,0.1); color: white; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 11px; transition: 0.2s; }
        .style-btn:hover, .style-btn.active { background: #00ffcc; color: black; font-weight: bold; }

        /* Markery */
        .marker { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; z-index: 50; animation: pulse 2s infinite; }
        .marker.wishlist-marker { border-color: #aaa; animation: none; opacity: 0.8; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0px rgba(255,255,255,0.7); } 100% { box-shadow: 0 0 0 12px rgba(255,255,255,0); } }

        .start-marker { width: 8px; height: 8px; border-radius: 50%; background: #fff; border: 1px solid #000; opacity: 0.7; pointer-events: none; z-index: 5; }
        
        /* Elegantný pulzujúci bod namiesto emoji */
        .route-pulse-dot {
            width: 10px; height: 10px; background-color: #00ffcc; border-radius: 50%;
            box-shadow: 0 0 12px #00ffcc, 0 0 20px #00ffcc; pointer-events: none; z-index: 100;
        }

        /* Vyskakovacie okná (Modaly) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center;
            z-index: 20000; opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.open { display: flex; opacity: 1; }
        
        .modal-content {
            background: #141414; border: 1px solid rgba(255,255,255,0.1);
            width: 90%; max-width: 550px; max-height: 85vh; border-radius: 24px;
            padding: 30px; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            overflow-y: auto; color: white; box-sizing: border-box;
        }
        .modal-close {
            position: absolute; top: 20px; right: 20px; background: #252525;
            border: none; color: white; font-size: 22px; width: 40px; height: 40px;
            border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; z-index: 10;
        }
        .modal-close:hover { background: #ff4d4d; color: white; }
        .modal-title { font-size: 26px; font-weight: 800; color: #00ffcc; margin-bottom: 5px; padding-right: 30px; }
        .modal-subtitle { color: #666; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px; }
        
        /* Časová os */
        .timeline { border-left: 2px solid #252525; margin-left: 10px; padding-left: 25px; position: relative; }
        .timeline-item { position: relative; margin-bottom: 30px; padding-top: 2px; }
        .timeline-item:last-child { margin-bottom: 10px; }
        
        .timeline-header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
        .timeline-title-text { font-size: 14px; font-weight: 600; color: #aaa; }
        
        .timeline-badge {
            background: #00ffcc; color: black; font-size: 11px; font-weight: bold; 
            padding: 3px 8px; border-radius: 6px; box-shadow: 0 0 10px rgba(0,255,204,0.3);
            display: inline-block;
        }
        .timeline-badge.wish { background: #ffb142; color: black; box-shadow: none; }
        .timeline-badge.work { background: #38ef7d; color: black; box-shadow: none; }
        .timeline-badge.agency { background: #bdc3c7; color: black; box-shadow: none; }
        .timeline-desc { font-size: 14px; line-height: 1.5; color: #ccc; margin: 8px 0; }
        .modal-link { display: inline-block; background: #252525; color: #00ffcc; border: 1px solid rgba(0,255,204,0.2); padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: bold; transition: 0.3s; }
        .modal-link:hover { background: #00ffcc; color: black; }

        /* Formulár */
        .form-group { margin-bottom: 15px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .form-input {
            width: 100%; padding: 10px 14px; background: #1e1e1e; border: 1px solid #333; 
            color: white; border-radius: 8px; box-sizing: border-box; font-size: 14px; outline: none; transition: 0.2s;
        }
        .form-input:focus { border-color: #00ffcc; background: #252526; }
        .form-textarea { resize: none; font-family: inherit; }

        .add-button {
            position: fixed; bottom: 30px; right: 25px; width: 45px; height: 45px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            color: #888; text-decoration: none; backdrop-filter: blur(5px); z-index: 100; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .add-button:hover { background: #00ffcc; color: black; transform: scale(1.1); }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-box">
        <h2>🔒 Travel Diary</h2>
        <div class="label">Zadajte prístupové heslo</div>
        <input type="password" id="pass-input" placeholder="••••••••" onkeydown="if(event.key==='Enter') verifyPassword()">
        <br>
        <button onclick="verifyPassword()">Vstúpiť do mapy</button>
        <div id="auth-error">Nesprávne heslo. Skúste to znova.</div>
    </div>
</div>

<div id="map"></div>

<div id="stats-panel" class="ui-panel">
    <span class="label">Unikátne Miesta</span>
    <span id="country-count" class="count-val">0 miest</span>
    <div class="label" style="margin-top:15px;">Filtrovať obdobie</div>
    <div id="year-filter">
        <button class="year-btn active" onclick="filterYear('all', this)">Všetko</button>
    </div>
</div>

<div id="style-panel" class="ui-panel">
    <button id="btn-sat" class="style-btn" onclick="changeStyle('mapbox://styles/mapbox/satellite-streets-v12', 'btn-sat')">🛰️ Satelit</button>
    <button id="btn-dark" class="style-btn active" onclick="changeStyle('mapbox://styles/mapbox/dark-v11', 'btn-dark')">🌑 Dark</button>
    <button id="btn-neon" class="style-btn" onclick="changeStyle('mapbox://styles/makyyy/cm05isqtd03wzj7yhcnetr5yd3', 'btn-neon')">✨ Neon Night</button>
</div>

<div id="city-modal" class="modal-overlay" onclick="closeModal('city-modal')">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal('city-modal')">×</button>
        <div id="modal-city-name" class="modal-title">Mesto</div>
        <div id="modal-city-coords" class="modal-subtitle">Súradnice</div>
        <div id="modal-timeline" class="timeline"></div>
    </div>
</div>

<div id="add-modal" class="modal-overlay" onclick="closeModal('add-modal')">
    <div class="modal-content" style="max-width: 480px;" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal('add-modal')">×</button>
        <div class="modal-title" style="font-size: 22px; margin-bottom: 20px;">➕ Pridať nové dobrodružstvo</div>
        
        <form id="trip-form" onsubmit="submitTrip(event)">
            <div class="form-group" style="background: rgba(255, 77, 77, 0.1); padding: 12px; border-radius: 10px; border: 1px solid rgba(255, 77, 77, 0.2); margin-bottom: 15px;">
                <label class="label" style="color: #ff4d4d; font-weight: bold;">🔑 Bezpečnostný kľúč tabuľky *</label>
                <input type="password" id="f-auth-token" required placeholder="Sem napíš kľúč z Apps Scriptu" class="form-input" style="border-color: rgba(255, 77, 77, 0.4);">
            </div>

            <div class="form-row">
                <div>
                    <label class="label">Mesto *</label>
                    <input type="text" id="f-mesto" required placeholder="Napr. Paríž" class="form-input">
                </div>
                <div>
                    <label class="label">Rok návštevy *</label>
                    <input type="text" id="f-rok" required placeholder="2026 alebo Wishlist" class="form-input">
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label class="label">Lat (Šírka) *</label>
                    <input type="text" id="f-lat" required placeholder="48.8566" class="form-input">
                </div>
                <div>
                    <label class="label">Lng (Dĺžka) *</label>
                    <input type="text" id="f-lng" required placeholder="2.3522" class="form-input">
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label class="label">Farba bodky</label>
                    <input type="color" id="f-farba" value="#00ffcc" class="form-input" style="height: 41px; padding: 2px; cursor: pointer;">
                </div>
                <div>
                    <label class="label">Typ dopravy</label>
                    <select id="f-typ" class="form-input" style="height: 41px;">
                        <option value="Auto">Auto 🚗</option>
                        <option value="Vlak">Vlak 🚂</option>
                        <option value="Lietadlo">Lietadlo ✈️</option>
                        <option value="Pešo">Pešo 🚶</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label class="label">Kód krajiny *</label>
                    <input type="text" id="f-krajina" required maxlength="2" placeholder="SK" class="form-input" style="text-transform: uppercase;">
                </div>
                <div>
                    <label class="label">Kategória výletu *</label>
                    <select id="f-kategoria" class="form-input" style="height: 41px;">
                        <option value="Súkromné">Súkromné</option>
                        <option value="Pracovné">Pracovné</option>
                        <option value="Cestovka">Cestovka</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="label">Štart cesty (Mesto odkiaľ vyrážaš)</label>
                <input type="text" id="f-start" placeholder="Napr. Michalovce" class="form-input">
            </div>

            <div class="form-group">
                <label class="label">Trasa (Multicity - mestá oddelené bodkočiarkou)</label>
                <input type="text" id="f-trasa" placeholder="Presov; Zilina; Bratislava; Vieden" class="form-input">
            </div>

            <div class="form-group">
                <label class="label">Tvoj popis / Zážitky</label>
                <textarea id="f-popis" rows="3" placeholder="Aké to tam bolo? Čo ste zažili..." class="form-input form-textarea"></textarea>
            </div>

            <div class="form-group" style="margin-bottom: 25px;">
                <label class="label">Odkaz na fotoalbum</label>
                <input type="url" id="f-album" placeholder="http://photos.google.com/..." class="form-input">
            </div>

            <button type="submit" id="submit-btn" style="width: 100%; background: #00ffcc; border: none; color: black; padding: 13px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.3s;">Odoslať výlet do mapy</button>
        </form>
    </div>
</div>

<button onclick="openAddModal(null, null)" class="add-button" style="border:none; cursor:pointer;">+</button>

<script>
    const mapboxToken = 'pk.eyJ1IjoibWFreXl5IiwiYSI6ImNtbzVpc3FtdDB3ZjcycHNneTR5d2R3a2oifQ.Su6Onl3Dn-YL8XIPXRfB6g';
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSKxSWXvTdARJ382V_ddbLoem05pzFFn_oyDsbcSypciDETuXIHTlA9_xCmAYaZ_AklPPzGFVkpu9Ek/pub?output=csv';
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbze0JIRbupCEzBxNCBKxpsQLmJPzCpDHd1XZtUuG6fxpUh6fUzE9bOvUEgyxZXBkpk_uw/exec';

    mapboxgl.accessToken = mapboxToken;
    let allData = [];
    let securePassword = '';
    let markers = [];
    let startMarkers = [];
    let routeLayers = [];
    let transportMarkers = [];
    let currentYear = 'all';

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/dark-v11',
        center: [15, 48],
        zoom: 3.5,
        pitch: 45
    });

    map.addControl(new mapboxgl.NavigationControl(), 'top-right');

    function changeStyle(styleUrl, activeBtnId) {
        document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(activeBtnId).classList.add('active');
        map.setStyle(styleUrl);
        map.once('styledata', () => {
            renderMap(currentYear);
        });
    }

    fetch(csvUrl).then(res => res.text()).then(csvText => {
        Papa.parse(csvText, {
            header: true, skipEmptyLines: true,
            complete: function(results) {
                allData = results.data;
                const passRow = allData.find(r => r.Heslo || Object.values(r).includes('Heslo'));
                if(passRow) {
                    securePassword = passRow.Heslo || Object.values(passRow)[11];
                }
            }
        });
    });

    async function hashPassword(string) {
        const utf8 = new ArrayBuffer(string.length * 2);
        const view = new Uint16Array(utf8);
        for (let i = 0; i < string.length; i++) { view[i] = string.charCodeAt(i); }
        const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function verifyPassword() {
        const input = document.getElementById('pass-input').value;
        const inputHash = await hashPassword(input.trim());
        const correctHash = await hashPassword(securePassword.trim());
        
        if (securePassword && inputHash === correctHash) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('map').classList.add('visible');
            setupFilters();
            renderMap('all');
        } else {
            const err = document.getElementById('auth-error');
            err.style.display = 'block';
        }
    }

    function setupFilters() {
        const years = [...new Set(allData.map(d => d.Rok).filter(y => y && !isNaN(y)))].sort().reverse();
        const filterDiv = document.getElementById('year-filter');
        filterDiv.innerHTML = '<button class="year-btn active" onclick="filterYear(\'all\', this)">Všetko</button>';
        
        years.forEach(year => {
            const btn = document.createElement('button');
            btn.className = 'year-btn';
            btn.innerText = year;
            btn.onclick = (e) => { currentYear = year; filterYear(year, e.target); };
            filterDiv.appendChild(btn);
        });

        if(allData.some(d => (d.Rok || '').toLowerCase() === 'wishlist')) {
            const wishBtn = document.createElement('button');
            wishBtn.className = 'year-btn';
            wishBtn.innerHTML = '✨ Wishlist';
            wishBtn.style.borderColor = '#ffb142';
            wishBtn.onclick = (e) => { currentYear = 'wishlist'; filterYear('wishlist', e.target); };
            filterDiv.appendChild(wishBtn);
        }
    }

    function filterYear(year, btnElement) {
        document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        renderMap(year);
    }

    function renderMap(yearFilter) {
        [...markers, ...startMarkers, ...transportMarkers].forEach(m => m.remove());
        routeLayers.forEach(l => { if(map.getLayer(l)) map.removeLayer(l); if(map.getSource(l)) map.removeSource(l); });
        markers = []; startMarkers = []; routeLayers = []; transportMarkers = [];

        if (map.getLayer('country-fills')) map.removeLayer('country-fills');
        if (map.getLayer('country-borders')) map.removeLayer('country-borders');
        if (map.getSource('countries')) map.removeSource('countries');

        let filteredRows = allData.filter(row => {
            const lat = parseFloat(row.Lat);
            if (isNaN(lat)) return false;
            if (yearFilter === 'all') return (row.Rok || '').toLowerCase() !== 'wishlist';
            return (row.Rok || '').toLowerCase() === yearFilter.toLowerCase();
        });

        let visitedCountries = [...new Set(filteredRows.map(r => r.Krajina ? r.Krajina.trim().toUpperCase() : '').filter(c => c.length === 2))];
        
        if (visitedCountries.length > 0 && map.getLayer('admin-0-boundary')) {
            map.addSource('countries', {
                type: 'vector',
                url: 'mapbox://mapbox.country-boundaries-v1'
            });

            // Ak je zapnutá Neon Night, zafarbíme krajiny jasnejšie a kontrastnejšie
            const isNeon = map.getStyle().sprite.includes('makyyy');
            const fillColor = isNeon ? '#00ffcc' : '#00ffcc';
            const fillOpacity = isNeon ? 0.15 : 0.08;

            map.addLayer({
                'id': 'country-fills',
                'type': 'fill',
                'source': 'countries',
                'source-layer': 'country_boundaries',
                'paint': {
                    'fill-color': fillColor,
                    'fill-opacity': fillOpacity
                },
                'filter': ['in', 'iso_3166_1', ...visitedCountries]
            }, 'airport-label');

            map.addLayer({
                'id': 'country-borders',
                'type': 'line',
                'source': 'countries',
                'source-layer': 'country_boundaries',
                'paint': {
                    'line-color': fillColor,
                    'line-width': isNeon ? 1.5 : 1,
                    'line-opacity': 0.4
                },
                'filter': ['in', 'iso_3166_1', ...visitedCountries]
            }, 'airport-label');
        }

        let uniqueCities = [...new Set(filteredRows.map(r => r.Mesto.trim().toLowerCase()))];
        document.getElementById('country-count').innerText = `${uniqueCities.length} ${uniqueCities.length === 1 ? 'mesto' : uniqueCities.length < 5 ? 'miesta' : 'miest'}`;

        let cityGroups = {};
        filteredRows.forEach(row => {
            const key = `${parseFloat(row.Lat).toFixed(4)},${parseFloat(row.Lng).toFixed(4)}`;
            if (!cityGroups[key]) cityGroups[key] = [];
            cityGroups[key].push(row);
        });

        Object.keys(cityGroups).forEach((coordsKey, index) => {
            const group = cityGroups[coordsKey];
            const firstRow = group[0];
            const lat = parseFloat(firstRow.Lat);
            const lng = parseFloat(firstRow.Lng);
            const farba = firstRow.Farba || '#00ffcc';
            const isWishlist = (firstRow.Rok || '').toLowerCase() === 'wishlist';

            const el = document.createElement('div');
            el.className = 'marker' + (isWishlist ? ' wishlist-marker' : '');
            el.style.backgroundColor = farba;
            
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                openCityModal(firstRow.Mesto, lat, lng, group);
            });

            const m = new mapboxgl.Marker(el).setLngLat([lng, lat]).addTo(map);
            markers.push(m);

            if (firstRow.Trasa && firstRow.Trasa.trim().length > 3) {
                const routeId = 'route-' + index;
                generateRealRoute(firstRow.Trasa, farba, routeId, firstRow.Typ, firstRow.Start, [lng, lat]);
            }
        });
    }

    function generateRealRoute(trasaString, farba, routeId, typ, startCity, targetCoords) {
        const zastavky = trasaString.split(';').map(z => z.trim());
        if(zastavky.length < 2) return;

        let promises = zastavky.map(mesto => 
            fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(mesto)}.json?access_token=${mapboxToken}`)
            .then(res => res.json())
            .then(data => data.features && data.features.length > 0 ? data.features[0].center : null)
        );

        Promise.all(promises).then(coordsArray => {
            const validCoords = coordsArray.filter(c => c !== null);
            if(validCoords.length < 2) return;

            if (startCity) {
                const sEl = document.createElement('div');
                sEl.className = 'start-marker';
                const sm = new mapboxgl.Marker(sEl).setLngLat(validCoords[0]).addTo(map);
                startMarkers.push(sm);
            }

            const t = (typ || '').toLowerCase();
            
            // LIETADLO letí vždy plynulým oblúkom (nie suchou priamou čiarou)
            if (t.includes('lietadlo')) {
                drawArcLine(validCoords, farba, routeId);
                return;
            }

            // AUTO a VLAK idú cez 100% spoľahlivú navigáciu na ceste
            const profile = t.includes('pešo') ? 'walking' : 'driving';
            const coordString = validCoords.map(c => `${c[0]},${c[1]}`).join(';');
            
            fetch(`https://api.mapbox.com/directions/v5/mapbox/${profile}/${coordString}?geometries=geojson&overview=full&access_token=${mapboxToken}`)
            .then(res => res.json())
            .then(dirData => {
                if(!dirData.routes || dirData.routes.length === 0) {
                    // Ak navigácia zlyhala (napr. cez more), vykreslí sa plynulý oblúk ako poistka
                    drawArcLine(validCoords, farba, routeId);
                    return;
                }
                const routeGeometry = dirData.routes[0].geometry;

                map.addSource(routeId, { 'type': 'geojson', 'data': { 'type': 'Feature', 'geometry': routeGeometry } });
                map.addLayer({
                    'id': routeId, 'type': 'line', 'source': routeId,
                    'layout': { 'line-join': 'round', 'line-cap': 'round' },
                    'paint': { 'line-color': farba, 'line-width': 3, 'line-opacity': 0.6 }
                });
                routeLayers.push(routeId);
                animatePulseDot(routeGeometry.coordinates);
            }).catch(() => {
                drawArcLine(validCoords, farba, routeId);
            });
        });
    }

    // Funkcia pre vykreslenie plynulého zakrivenia (oblúka) namiesto tvrdej priamej čiary
    function drawArcLine(points, farba, routeId) {
        let arcCoords = [];
        for (let i = 0; i < points.length - 1; i++) {
            const start = points[i];
            const end = points[i+1];
            const steps = 100;
            
            for (let j = 0; j <= steps; j++) {
                const pct = j / steps;
                const lng = start[0] + (end[0] - start[0]) * pct;
                const lat = start[1] + (end[1] - start[1]) * pct;
                
                // Matematické zakrivenie (parabola pre vytvorenie 3D efektu oblúka)
                const offset = Math.sin(Math.PI * pct) * (Math.abs(end[0] - start[0]) * 0.15);
                arcCoords.push([lng, lat + offset]);
            }
        }

        map.addSource(routeId, { 'type': 'geojson', 'data': { 'type': 'Feature', 'geometry': { 'type': 'LineString', 'coordinates': arcCoords } } });
        map.addLayer({ 'id': routeId, 'type': 'line', 'source': routeId, 'paint': { 'line-color': farba, 'line-width': 2.5, 'line-opacity': 0.6 } });
        routeLayers.push(routeId);
        animatePulseDot(arcCoords);
    }

    // Minimalistický svietiaci bod namiesto emoji
    function animatePulseDot(coordinates) {
        const pulseEl = document.createElement('div');
        pulseEl.className = 'route-pulse-dot';
        const pMarker = new mapboxgl.Marker(pulseEl).setLngLat(coordinates[0]).addTo(map);
        transportMarkers.push(pMarker);

        let counter = 0;
        function step() {
            if (!transportMarkers.includes(pMarker)) return;
            counter = (counter + 0.3) % 1000;
            const ratio = counter / 1000;
            const pointIndex = Math.floor(ratio * (coordinates.length - 1));
            const nextPointIndex = Math.min(pointIndex + 1, coordinates.length - 1);
            const segmentRatio = (ratio * (coordinates.length - 1)) - pointIndex;
            
            const currentLng = coordinates[pointIndex][0] + (coordinates[nextPointIndex][0] - coordinates[pointIndex][0]) * segmentRatio;
            const currentLat = coordinates[pointIndex][1] + (coordinates[nextPointIndex][1] - coordinates[pointIndex][1]) * segmentRatio;
            
            pMarker.setLngLat([currentLng, currentLat]);
            requestAnimationFrame(step);
        }
        step();
    }

    function openCityModal(cityName, lat, lng, visitsGroup) {
        document.getElementById('modal-city-name').innerText = cityName;
        document.getElementById('modal-city-coords').innerText = `${lng.toFixed(4)}° E, ${lat.toFixed(4)}° N`;
        
        const timelineDiv = document.getElementById('modal-timeline');
        timelineDiv.innerHTML = '';

        visitsGroup.sort((a,b) => b.Rok - a.Rok).forEach(visit => {
            const item = document.createElement('div');
            item.className = 'timeline-item';

            const isWish = (visit.Rok || '').toLowerCase() === 'wishlist';
            const cat = (visit.Kategoria || '').toLowerCase();
            
            let badgeClass = 'timeline-badge';
            let badgeText = visit.Rok;

            if (isWish) {
                badgeClass += ' wish';
                badgeText = 'PLÁN';
            } else if (cat.includes('pracovn')) {
                badgeClass += ' work';
                badgeText = `${visit.Rok} • Pracovné`;
            } else if (cat.includes('cestovk')) {
                badgeClass += ' agency';
                badgeText = `${visit.Rok} • Cestovka`;
            } else {
                badgeText = `${visit.Rok} • Súkromné`;
            }

            const routeTitle = visit.Start ? `${visit.Start} ➔ ${visit.Mesto}` : visit.Mesto;
            const typeText = visit.Typ ? `(${visit.Typ})` : '';

            item.innerHTML = `
                <div class="timeline-header">
                    <span class="${badgeClass}">${badgeText}</span>
                    <span class="timeline-title-text">${routeTitle} ${typeText}</span>
                </div>
                <div class="timeline-desc">${visit.Popis || 'Bez popisu.'}</div>
                ${visit.Album ? `<a href="${visit.Album}" target="_blank" class="modal-link">Pozrieť fotky z výletu 📸</a>` : ''}
            `;
            timelineDiv.appendChild(item);
        });

        document.getElementById('city-modal').classList.add('open');
    }

    function openAddModal(clickLat, clickLng) {
        document.getElementById('trip-form').reset();
        
        if(clickLat !== null && clickLng !== null) {
            document.getElementById('f-lat').value = clickLat;
            document.getElementById('f-lng').value = clickLng;
        }
        
        document.getElementById('add-modal').classList.add('open');
    }

    function closeModal(modalId) {
        document.getElementById(modalId).classList.remove('open');
    }

    function submitTrip(event) {
        event.preventDefault();
        
        const btn = document.getElementById('submit-btn');
        const oldText = btn.innerText;
        btn.innerText = 'Ukladám do Google tabuľky... ⏳';
        btn.style.opacity = '0.6';
        btn.disabled = true;

        const isWishlist = document.getElementById('f-rok').value.trim().toLowerCase() === 'wishlist';
        const defaultColor = isWishlist ? '#ffb142' : document.getElementById('f-farba').value;
        const userAuthToken = document.getElementById('f-auth-token').value;

        const tripData = {
            auth_token: userAuthToken,
            mesto: document.getElementById('f-mesto').value,
            lat: document.getElementById('f-lat').value,
            lng: document.getElementById('f-lng').value,
            rok: document.getElementById('f-rok').value,
            farba: defaultColor,
            typ: document.getElementById('f-typ').value,
            krajina: document.getElementById('f-krajina').value.toUpperCase(),
            kategoria: document.getElementById('f-kategoria').value, // Súkromné / Pracovné / Cestovka
            start: document.getElementById('f-start').value,
            trasa: document.getElementById('f-trasa').value,
            popis: document.getElementById('f-popis').value,
            album: document.getElementById('f-album').value
        };

        fetch(scriptUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(tripData)
        })
        .then(res => res.json())
        .then(response => {
            if (response.status === 'success') {
                alert('🎉 Paráda! Trip bol úspešne zapísaný do tabuľky. Pre prenesenie zmien na mapu stačí obnoviť (F5) stránku.');
                closeModal('add-modal');
            } else {
                alert('Chyba: ' + response.message);
            }
            btn.innerText = oldText;
            btn.style.opacity = '1';
            btn.disabled = false;
        })
        .catch(err => {
            alert('🚀 Požiadavka odoslaná! Ak bol kľúč správny, výlet sa zapísal. Over si to v tabuľke a obnov mapu.');
            closeModal('add-modal');
            btn.innerText = oldText;
            btn.style.opacity = '1';
            btn.disabled = false;
        });
    }

    map.on('click', (e) => {
        const lat = e.lngLat.lat.toFixed(4);
        const lng = e.lngLat.lng.toFixed(4);
        openAddModal(lat, lng);
    });
</script>
